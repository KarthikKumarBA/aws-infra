name: Terraform

on:
  pull_request:
    branches: [main]
    paths: ["eks/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "plan, apply or destroy"
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm:
        description: 'For destroy, type "destroy"'
        type: string
        default: ""

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-eks
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Format check
        run: terraform fmt -check -recursive || echo "::warning::Run 'terraform fmt -recursive' locally"

      - name: Validate
        run: terraform validate

      - name: Plan
        if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -no-color tfplan | tail -n 60 > plan-summary.txt
          {
            echo "### Terraform plan"
            echo '```'
            cat plan-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: github.event.inputs.action == 'apply'
        run: |
          terraform apply -input=false tfplan
          {
            echo "### Outputs - set these in the app repositories"
            echo '```'
            terraform output app_repo_github_variables
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Helm (destroy)
        if: github.event.inputs.action == 'destroy'
        uses: azure/setup-helm@v4

      - name: Remove load balancers before destroy
        if: github.event.inputs.action == 'destroy' && github.event.inputs.confirm == 'destroy'
        working-directory: .
        run: scripts/pre-destroy.sh "$(terraform -chdir=eks output -raw cluster_name 2>/dev/null || echo karthik-eks)" "${{ vars.AWS_REGION }}"

      - name: Destroy
        if: github.event.inputs.action == 'destroy' && github.event.inputs.confirm == 'destroy'
        run: terraform destroy -input=false -auto-approve

      - name: Destroy not confirmed
        if: github.event.inputs.action == 'destroy' && github.event.inputs.confirm != 'destroy'
        run: |
          echo "::error::Type 'destroy' in the confirm field to destroy the cluster."
          exit 1
